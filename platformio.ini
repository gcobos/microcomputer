; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; Módulo real: ESP32-C3 SuperMini. Se usa la board genérica devkitm-1 + los
; flags de USB nativo (el SuperMini no lleva puente USB-UART: se flashea y se
; abre el monitor por el USB-CDC del propio C3).
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; La CPU emulada reserva un array estático de 64 KiB (compi::kMemSize). Solo
; el ESP32-C3 (~400 KiB SRAM) lo admite: ni el Nano (2 KiB) ni el Wemos D1
; R1 / ESP8266 (~50 KiB utiles) enlazan siquiera con ese .bss.
lib_deps = 
	adafruit/Adafruit SH110X
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
