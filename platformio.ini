; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; Módulo real: ESP32-C3 SuperMini. Se usa la board genérica devkitm-1 + los
; flags de USB nativo (el SuperMini no lleva puente USB-UART: se flashea y se
; abre el monitor por el USB-CDC del propio C3).
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; El framework de Espressif compila TODO (incluidas nuestras fuentes) con
; -fno-jump-tables -fno-tree-switch-conversion: evita que una tabla de saltos
; acabe en flash y una ISR la lea con la cache de flash interna deshabilitada
; (durante un borrado/escritura de la flash PROPIA del chip). Aqui no aplica
; a src/*.cpp: no hay IRAM_ATTR ni ISRs de hardware (el sampler del panel usa
; ESP_TIMER_TASK, no ESP_TIMER_ISR), no hay WiFi/BT, y el almacenamiento de
; programas es un chip de flash EXTERNO por SPI bit a bit (spi_flash_storage.cpp)
; que nunca toca ni deshabilita la flash interna del propio ESP32-C3. Sin la
; tabla de saltos, el switch(family) de 21 casos en cpu.cpp::step() (el bucle
; mas caliente de todo el firmware, se ejecuta una vez por instruccion
; emulada) se compila como una cadena de comparaciones secuenciales en vez de
; O(1). build_src_flags solo afecta a nuestro codigo (src/), no a las
; librerias ni al framework, que conservan la flag original por si acaso.
build_src_flags =
	-fjump-tables
	-ftree-switch-conversion
	-O3
; El framework tambien compila TODO con -Os (optimizar por tamaño): con eso,
; funciones minusculas de cpu.cpp como fetch8() (16 bytes) NO se integran
; (inline) dentro de step() -- quedan como llamadas de funcion reales, con
; su prologo/epilogo, en el bucle mas caliente de todo el firmware (llamadas
; 3-6 veces por instruccion emulada). Confirmado con nm/objdump sobre el .o:
; con -O3 el cuerpo compilado de step() practicamente se dobla (esas
; funciones pasan a integrarse ahi) a cambio de ~10 KiB de flash de 1,3 MiB
; disponibles -- irrelevante. Igual que arriba, aplica solo a src/.
; La CPU emulada reserva un array estático de 64 KiB (compi::kMemSize). Solo
; el ESP32-C3 (~400 KiB SRAM) lo admite: ni el Nano (2 KiB) ni el Wemos D1
; R1 / ESP8266 (~50 KiB utiles) enlazan siquiera con ese .bss.
lib_deps =
	adafruit/Adafruit SH110X
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
