<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 783.9" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="1000" height="783.9" fill="#ffffff"/>
  <defs>
    <radialGradient id="knob" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f0f0f2"/><stop offset="58%" stop-color="#d7d7db"/><stop offset="100%" stop-color="#bababf"/>
    </radialGradient>
    <linearGradient id="panelg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efeff1"/><stop offset="100%" stop-color="#e1e1e4"/>
    </linearGradient>
  </defs>
  <style>
    .name  { font-size:15px; font-weight:700; fill:#26262b; letter-spacing:.5px; }
    .act   { font-size:10.5px; fill:#5a5a62; }
    .tiny  { font-size:9px;  fill:#9a9aa2; }
    .state { font-size:9.5px; font-weight:700; fill:#26262b; }
    .sw    { font-size:9px; fill:#8a8a92; letter-spacing:1.2px; }
    .oledtxt { font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace; font-size:12.5px; fill:#cfe8e0; white-space:pre; }
    .lg    { font-size:11px; fill:#3a3a40; }
    .lgh   { font-size:11px; font-weight:700; fill:#26262b; }
  </style>
  <!-- generado por un script a partir del layout real de la caja -->
  <text x="40" y="34" font-size="20" font-weight="800" fill="#2c2c32">compi · control panel</text>
  <text x="40" y="52" font-size="11.5" fill="#7b7b82">emulated 8-bit microcomputer — ESP32-C3 · front view of the real case</text>
  <text x="960" y="34" text-anchor="end" class="tiny">docs/panel.svg</text>

  <rect x="173.0" y="60.0" width="654.5" height="521.9" rx="71.4" fill="url(#panelg)" stroke="#8f8f96" stroke-width="2.5"/>
  <rect x="183.2" y="70.2" width="634.1" height="501.5" rx="61.2" fill="none" stroke="#b4b4ba" stroke-width="1.5"/>
  <!-- SW_MODE: deslizante horizontal "EDIT <-SW_MODE-> RUN" -->
  <rect x="266.5" y="75.3" width="71.4" height="30.6" rx="3" fill="#c6c6ca" stroke="#5f5f66" stroke-width="1.5"/>
  <rect x="271.5" y="87.6" width="61.4" height="6" rx="3" fill="#47474c"/>
  <rect x="270.5" y="79.3" width="30.0" height="22.6" rx="3" fill="#5a5a60" stroke="#37373b"/>
  <text x="261.5" y="94.6" text-anchor="end" class="state">EDIT</text>
  <text x="342.9" y="94.6" class="state">RUN</text>
  <text x="302.2" y="119.9" text-anchor="middle" class="sw">SW_MODE</text>
  <!-- SW_STEP: deslizante horizontal "SINGLE <-SW_STEP-> CONTINUOUS" -->
  <rect x="662.6" y="75.3" width="71.4" height="30.6" rx="3" fill="#c6c6ca" stroke="#5f5f66" stroke-width="1.5"/>
  <rect x="667.6" y="87.6" width="61.4" height="6" rx="3" fill="#47474c"/>
  <rect x="666.6" y="79.3" width="30.0" height="22.6" rx="3" fill="#5a5a60" stroke="#37373b"/>
  <text x="657.6" y="94.6" text-anchor="end" class="state">SINGLE</text>
  <text x="739.0" y="94.6" class="state">CONTINUOUS</text>
  <text x="698.3" y="119.9" text-anchor="middle" class="sw">SW_STEP</text>
  <!-- encoder ADDR -->
  <rect x="237.6" y="184.1" width="96.9" height="96.9" rx="3" fill="#dcdce0" stroke="#5f5f66" stroke-width="1.5"/>
  <g transform="translate(286.1,232.6)">
    <circle r="38.8" fill="url(#knob)" stroke="#8f8f96" stroke-width="1.5"/>
    <circle r="38.8" fill="none" stroke="#8f8f96" stroke-width="4" stroke-dasharray="2 4"/>
    <circle r="27.1" fill="#e7e7ea" stroke="#c2c2c8"/>
    <line x1="0" y1="-3" x2="0" y2="-25.2" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="286.1" y="303.0" text-anchor="middle" class="name">ADDR</text>
  <text x="286.1" y="319.0" text-anchor="middle" class="act">turn — cursor / slot</text>
  <text x="286.1" y="333.0" text-anchor="middle" class="act">press — cursor −1 / reset</text>
  <text x="286.1" y="347.0" text-anchor="middle" class="tiny">running → IN 0x0600 · 0x0601</text>
  <!-- encoder DATA -->
  <rect x="669.4" y="184.1" width="96.9" height="96.9" rx="3" fill="#dcdce0" stroke="#5f5f66" stroke-width="1.5"/>
  <g transform="translate(717.9,232.6)">
    <circle r="38.8" fill="url(#knob)" stroke="#8f8f96" stroke-width="1.5"/>
    <circle r="38.8" fill="none" stroke="#8f8f96" stroke-width="4" stroke-dasharray="2 4"/>
    <circle r="27.1" fill="#e7e7ea" stroke="#c2c2c8"/>
    <line x1="0" y1="-3" x2="0" y2="-25.2" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="717.9" y="303.0" text-anchor="middle" class="name">DATA</text>
  <text x="717.9" y="319.0" text-anchor="middle" class="act">turn — edit field / action</text>
  <text x="717.9" y="333.0" text-anchor="middle" class="act">press — confirm / do / 1 step</text>
  <text x="717.9" y="347.0" text-anchor="middle" class="tiny">running → IN 0x0602 · 0x0603</text>
  <!-- OLED en su marco -->
  <rect x="371.9" y="111.0" width="256.7" height="221.0" rx="4" fill="#2a2b2e" stroke="#5f5f66" stroke-width="1.5"/>
  <rect x="380.4" y="133.1" width="239.7" height="139.4" fill="#04070a" stroke="#17181a"/>
  <g class="oledtxt" xml:space="preserve">
    <text x="386.4" y="148.1">0005 OP</text>
    <text x="386.4" y="164.7"> 0000 MOV AL,#0x2A</text>
    <text x="386.4" y="181.3"> 0002 MOV BL,#0x03</text>
    <rect x="380.4" y="185.9" width="239.7" height="16" fill="#cfe8e0"/>
    <text x="386.4" y="197.9" fill="#04070a">&gt;0005 ADD AL,[0x0020]</text>
    <text x="386.4" y="214.5"> 0008 STA [0x0021],AL</text>
    <text x="386.4" y="231.1"> 000B HALT</text>
    <text x="386.4" y="247.7">cur 0005 = 0x2A</text>
    <text x="386.4" y="264.3">PC 0000 SP FFFF ----</text>
  </g>
  <text x="500.2" y="303.1" text-anchor="middle" class="tiny" fill="#9a9aa2">OLED SH1106 · 128 × 64</text>
  <!-- LED de a bordo y rejilla del zumbador -->
  <circle cx="441.6" cy="384.7" r="10.2" fill="#2ea8ff" stroke="#1f6fb0" stroke-width="1.5"/>
  <circle cx="438.6" cy="381.7" r="2.5" fill="#bfe4ff"/>
  <text x="423.40000000000003" y="382.7" text-anchor="end" class="name" style="font-size:12px">LED</text>
  <text x="423.40000000000003" y="395.7" text-anchor="end" class="tiny">OUT 0x0610</text>
  <rect x="484.1" y="349.0" width="34.0" height="6.8" rx="3.4" fill="#8f8f97" stroke="#5f5f66"/>
  <rect x="473.9" y="364.3" width="61.2" height="6.8" rx="3.4" fill="#8f8f97" stroke="#5f5f66"/>
  <rect x="463.7" y="381.3" width="74.8" height="6.8" rx="3.4" fill="#8f8f97" stroke="#5f5f66"/>
  <rect x="473.9" y="396.6" width="61.2" height="6.8" rx="3.4" fill="#8f8f97" stroke="#5f5f66"/>
  <rect x="484.1" y="411.90000000000003" width="34.0" height="6.8" rx="3.4" fill="#8f8f97" stroke="#5f5f66"/>
  <text x="548.5" y="382.7" class="name" style="font-size:12px">SOUND</text>
  <text x="548.5" y="395.7" class="tiny">piezo · OUT 0x0630–0x0633</text>
  <!-- lenguetas flexibles recortadas en la tapa: pulsan RESET y BOOT de la SuperMini -->
  <text x="446.9" y="483.3" text-anchor="end" class="name" style="font-size:12px">RESET · MUTE</text>
  <text x="446.9" y="496.3" text-anchor="end" class="tiny">press tabs cut in the case, over</text>
  <text x="446.9" y="508.3" text-anchor="end" class="tiny">the SuperMini RESET and BOOT buttons</text>
  <text x="446.9" y="520.3" text-anchor="end" class="tiny">BOOT = sound MUTE / UNMUTE</text>
  <g fill="none" stroke="#3a3a40" stroke-width="2.2" stroke-linecap="round">
    <line x1="462.0" y1="451.0" x2="462.0" y2="488.4"/>
    <line x1="496.0" y1="451.0" x2="496.0" y2="488.4"/>
    <line x1="530.0" y1="451.0" x2="530.0" y2="488.4"/>
    <path d="M462.0,488.4 Q462.0,498.6 472.2,500.3"/><path d="M496.0,488.4 Q496.0,498.6 485.8,500.3"/>
    <path d="M496.0,488.4 Q496.0,498.6 506.2,500.3"/><path d="M530.0,488.4 Q530.0,498.6 519.8,500.3"/>
    <circle cx="479.0" cy="510.5" r="10.2"/><circle cx="513.0" cy="510.5" r="10.2"/>
  </g>
  <!-- ON/OFF: deslizante vertical -->
  <rect x="575.9" y="459.5" width="35.7" height="73.1" rx="3" fill="#c6c6ca" stroke="#5f5f66" stroke-width="1.5"/>
  <rect x="590.8" y="464.5" width="6" height="63.1" rx="3" fill="#47474c"/>
  <rect x="579.9" y="463.5" width="27.7" height="30.7" rx="3" fill="#5a5a60" stroke="#37373b"/>
  <text x="619.6" y="469.5" class="state">ON</text>
  <text x="619.6" y="530.6" class="state">OFF</text>

  <!-- leyenda: la rejilla 2x2 de vistas -->
  <rect x="40" y="603.9" width="920" height="160" rx="10" fill="#f5f5f7" stroke="#dedee3"/>
  <text x="58" y="625.9" class="lgh">The 4 views — by the two slide switches</text>
  <line x1="230" y1="635.9" x2="230" y2="753.9" stroke="#d7d7dc"/>
  <line x1="595" y1="635.9" x2="595" y2="753.9" stroke="#d7d7dc"/>
  <line x1="58" y1="677.9" x2="944" y2="677.9" stroke="#d7d7dc"/>
  <line x1="58" y1="715.9" x2="944" y2="715.9" stroke="#d7d7dc"/>
  <text x="410" y="655.9" text-anchor="middle" class="lgh">SW_MODE ◀ EDIT</text>
  <text x="775" y="655.9" text-anchor="middle" class="lgh">SW_MODE ▶ RUN</text>
  <text x="144" y="695.9" text-anchor="middle" class="lgh">SW_STEP ◀ SINGLE</text>
  <text x="144" y="737.9" text-anchor="middle" class="lgh">SW_STEP ▶ CONTINUOUS</text>
  <text x="245" y="691.9" class="lgh">EDIT MEMORY</text>
  <text x="245" y="706.9" class="lg">turn DATA = edit field · press DATA = confirm/next</text>
  <text x="245" y="731.9" class="lgh">EDIT PROGRAMS</text>
  <text x="245" y="746.9" class="lg">ADDR = slot · DATA = LOAD ⇄ SAVE</text>
  <text x="610" y="691.9" class="lgh">SINGLE STEP</text>
  <text x="610" y="706.9" class="lg">press DATA = 1 instruction · ADDR = reset</text>
  <text x="610" y="731.9" class="lgh">CONTINUOUS</text>
  <text x="610" y="746.9" class="lg">runs until HALT · screen = program's graphics + text</text>
</svg>