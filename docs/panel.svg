<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="1000" height="648" fill="#ffffff"/>
  <defs>
    <radialGradient id="knob" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f0f0f2"/>
      <stop offset="58%" stop-color="#d7d7db"/>
      <stop offset="100%" stop-color="#bababf"/>
    </radialGradient>
    <linearGradient id="panelg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efeff1"/>
      <stop offset="100%" stop-color="#e1e1e4"/>
    </linearGradient>
  </defs>
  <style>
    .name  { font-size:17px; font-weight:700; fill:#26262b; letter-spacing:.5px; }
    .act   { font-size:11.5px; fill:#5a5a62; }
    .tiny  { font-size:9.5px;  fill:#9a9aa2; }
    .state { font-size:12px; font-weight:600; fill:#26262b; }
    .sw    { font-size:10px; fill:#8a8a92; letter-spacing:1.5px; }
    .oledtxt { font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace; font-size:15px; fill:#cfe8e0; }
    .lg    { font-size:11px; fill:#3a3a40; }
    .lgh   { font-size:11px; font-weight:700; fill:#26262b; }
  </style>

  <rect x="14" y="14" width="972" height="620" rx="18" fill="url(#panelg)" stroke="#adadb3" stroke-width="2"/>
  <rect x="28" y="28" width="944" height="592" rx="11" fill="none" stroke="#d2d2d7"/>
  <g fill="#c4c4c9" stroke="#a0a0a6">
    <circle cx="46" cy="46" r="6"/><circle cx="954" cy="46" r="6"/>
    <circle cx="46" cy="602" r="6"/><circle cx="954" cy="602" r="6"/>
  </g>

  <text x="68" y="54" font-size="21" font-weight="800" fill="#2c2c32">compi · control panel</text>
  <text x="68" y="74" font-size="11.5" fill="#7b7b82">emulated 8-bit microcomputer — ESP32-C3</text>
  <text x="922" y="52" text-anchor="end" class="tiny">docs/panel.svg</text>

  <!-- OLED -->
  <rect x="326" y="92" width="348" height="186" rx="9" fill="#17181a" stroke="#3c3c40" stroke-width="3"/>
  <rect x="340" y="104" width="320" height="162" fill="#04070a"/>
  <g class="oledtxt">
    <text x="347" y="119">0005 OP</text>
    <text x="347" y="139"> 0000 MOV AL,#0x2A</text>
    <text x="347" y="159"> 0002 MOV BL,#0x03</text>
    <rect x="340" y="165" width="320" height="20" fill="#cfe8e0"/>
    <text x="347" y="179" fill="#04070a">&gt;0005 ADD AL,[0x0020]</text>
    <text x="347" y="199"> 0008 STA [0x0021],AL</text>
    <text x="347" y="219"> 000B HALT</text>
    <text x="347" y="239">cur 0005 = 0x2A</text>
    <text x="347" y="259">PC 0000  SP FFFF ----</text>
  </g>
  <text x="500" y="296" text-anchor="middle" class="tiny">OLED SH1106 · 128 × 64 · I2C</text>

  <!-- LED de a bordo (GPIO8), salida del programa emulado -->
  <circle cx="712" cy="108" r="8" fill="#2ea8ff" stroke="#1f6fb0" stroke-width="1.5"/>
  <circle cx="709" cy="105" r="2.5" fill="#bfe4ff"/>
  <text x="712" y="130" text-anchor="middle" class="tiny">onboard LED</text>
  <text x="712" y="142" text-anchor="middle" class="tiny">OUT (0x0510)</text>

  <!-- encoder izquierdo: DIRECCIÓN -->
  <g transform="translate(150,180)">
    <circle r="60" fill="url(#knob)" stroke="#a6a6ac" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#8f8f96" stroke-width="7" stroke-dasharray="3 6"/>
    <circle r="43" fill="#e7e7ea" stroke="#c2c2c8"/>
    <line x1="0" y1="-4" x2="0" y2="-41" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <circle r="6" fill="#666"/>
  </g>
  <text x="150" y="268" text-anchor="middle" class="name">ADDR</text>
  <text x="150" y="289" text-anchor="middle" class="act">turn — move cursor / pick slot</text>
  <text x="150" y="305" text-anchor="middle" class="act">press — cursor −1  /  reset (in STEP)</text>
  <text x="150" y="323" text-anchor="middle" class="tiny">when running → IN ports 0x0500 · 0x0501</text>

  <!-- encoder derecho: DATOS -->
  <g transform="translate(850,180)">
    <circle r="60" fill="url(#knob)" stroke="#a6a6ac" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#8f8f96" stroke-width="7" stroke-dasharray="3 6"/>
    <circle r="43" fill="#e7e7ea" stroke="#c2c2c8"/>
    <line x1="0" y1="-4" x2="0" y2="-41" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <circle r="6" fill="#666"/>
  </g>
  <text x="850" y="268" text-anchor="middle" class="name">DATA</text>
  <text x="850" y="289" text-anchor="middle" class="act">turn — edit field / pick action</text>
  <text x="850" y="305" text-anchor="middle" class="act">press — confirm field  /  do  /  1 step</text>
  <text x="850" y="323" text-anchor="middle" class="tiny">when running → IN ports 0x0502 · 0x0503</text>

  <!-- switches -->
  <g>
    <text x="415" y="316" text-anchor="middle" class="state">EDIT</text>
    <g transform="translate(415,372)">
      <rect x="-19" y="-24" width="38" height="48" rx="9" fill="#c6c6ca" stroke="#96969c" stroke-width="1.5"/>
      <rect x="-11" y="-30" width="22" height="13" rx="3" fill="#b2b2b7" stroke="#8c8c92"/>
      <line x1="0" y1="-15" x2="0" y2="-45" stroke="#37373b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="9" fill="#47474c"/>
    </g>
    <text x="415" y="410" text-anchor="middle" class="state">RUN</text>
    <text x="415" y="428" text-anchor="middle" class="sw">SW_MODE</text>
  </g>
  <g>
    <text x="585" y="316" text-anchor="middle" class="state">▲</text>
    <g transform="translate(585,372)">
      <rect x="-19" y="-24" width="38" height="48" rx="9" fill="#c6c6ca" stroke="#96969c" stroke-width="1.5"/>
      <rect x="-11" y="-30" width="22" height="13" rx="3" fill="#b2b2b7" stroke="#8c8c92"/>
      <line x1="0" y1="-15" x2="0" y2="-45" stroke="#37373b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="9" fill="#47474c"/>
    </g>
    <text x="585" y="410" text-anchor="middle" class="state">▼</text>
    <text x="585" y="428" text-anchor="middle" class="sw">SW_STEP</text>
  </g>

  <!-- salida de sonido: rejilla de agujeros sobre el zumbador piezo -->
  <g>
    <rect x="772" y="342" width="120" height="62" rx="10" fill="#e4e4e8" stroke="#cfcfd5"/>
    <g fill="#8f8f97">
      <circle cx="788" cy="358" r="3.1"/><circle cx="803" cy="358" r="3.1"/><circle cx="818" cy="358" r="3.1"/><circle cx="833" cy="358" r="3.1"/><circle cx="848" cy="358" r="3.1"/><circle cx="863" cy="358" r="3.1"/><circle cx="878" cy="358" r="3.1"/>
      <circle cx="788" cy="373" r="3.1"/><circle cx="803" cy="373" r="3.1"/><circle cx="818" cy="373" r="3.1"/><circle cx="833" cy="373" r="3.1"/><circle cx="848" cy="373" r="3.1"/><circle cx="863" cy="373" r="3.1"/><circle cx="878" cy="373" r="3.1"/>
      <circle cx="788" cy="388" r="3.1"/><circle cx="803" cy="388" r="3.1"/><circle cx="818" cy="388" r="3.1"/><circle cx="833" cy="388" r="3.1"/><circle cx="848" cy="388" r="3.1"/><circle cx="863" cy="388" r="3.1"/><circle cx="878" cy="388" r="3.1"/>
    </g>
    <text x="832" y="420" text-anchor="middle" class="name">SOUND</text>
    <text x="832" y="436" text-anchor="middle" class="act">piezo buzzer — OUT 0x0530–0x0533</text>
  </g>

  <!-- leyenda: la rejilla 2x2 de vistas -->
  <rect x="40" y="448" width="920" height="160" rx="10" fill="#f5f5f7" stroke="#dedee3"/>
  <text x="58" y="470" class="lgh">The 4 views — by the two switches</text>

  <line x1="230" y1="480" x2="230" y2="598" stroke="#d7d7dc"/>
  <line x1="595" y1="480" x2="595" y2="598" stroke="#d7d7dc"/>
  <line x1="58"  y1="522" x2="944" y2="522" stroke="#d7d7dc"/>
  <line x1="58"  y1="560" x2="944" y2="560" stroke="#d7d7dc"/>

  <text x="410" y="500" text-anchor="middle" class="lgh">SW_MODE ▲  EDIT</text>
  <text x="775" y="500" text-anchor="middle" class="lgh">SW_MODE ▼  RUN</text>

  <text x="144" y="540" text-anchor="middle" class="lgh">SW_STEP ▲</text>
  <text x="144" y="582" text-anchor="middle" class="lgh">SW_STEP ▼</text>

  <text x="245" y="536" class="lgh">EDIT MEMORY</text>
  <text x="245" y="551" class="lg">turn DATA = edit field · press DATA = confirm/next</text>
  <text x="245" y="576" class="lgh">EDIT PROGRAMS</text>
  <text x="245" y="591" class="lg">ADDR = slot · DATA = LOAD ⇄ SAVE</text>

  <text x="610" y="536" class="lgh">SINGLE STEP</text>
  <text x="610" y="551" class="lg">press DATA = 1 instruction · ADDR = reset</text>
  <text x="610" y="576" class="lgh">CONTINUOUS</text>
  <text x="610" y="591" class="lg">runs until HALT · screen = program's graphics + text</text>
</svg>
