<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1000" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="1260" height="1000" fill="#ffffff"/>
  <style>
    .ttl   { font-size:18px; font-weight:700; fill:#0f172a; }
    .sub   { font-size:12px; fill:#475569; }
    .grp   { font-size:12px; font-weight:700; fill:#0f172a; }
    .adr   { font-size:12px; font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace; fill:#0f172a; }
    .nm    { font-size:11.5px; font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace; fill:#1e293b; }
    .ac    { font-size:10px; font-weight:700; fill:#ffffff; }
    .fn    { font-size:11.5px; fill:#334155; }
    .hd    { font-size:10px; font-weight:700; fill:#64748b; letter-spacing:.5px; }
    .note  { font-size:11.5px; fill:#334155; }
    .mono  { font-size:11.5px; font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace; fill:#1e293b; }
    .cap   { font-size:10px; fill:#94a3b8; }
  </style>

  <text x="40" y="40" class="ttl">compi — mapa del espacio de puertos (IN / OUT)</text>
  <text x="40" y="60" class="sub">16 bits · 65536 puertos · independiente de la RAM · fuente: specs.txt §8 e include/iomap.h</text>

  <!-- ================= columna: espacio completo ================= -->
  <text x="70" y="96" class="grp">Espacio completo</text>
  <rect x="70" y="110" width="150" height="820" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- pantalla: graficos -->
  <rect x="70" y="110" width="150" height="130" fill="#dbeafe" stroke="#0969da"/>
  <text x="145" y="162" text-anchor="middle" class="nm" fill="#0969da">GRÁFICOS</text>
  <text x="145" y="178" text-anchor="middle" class="cap">0x0000–0x03FF</text>
  <!-- pantalla: texto -->
  <rect x="70" y="240" width="150" height="40" fill="#bfdbfe" stroke="#0969da"/>
  <text x="145" y="265" text-anchor="middle" class="nm" fill="#0969da">TEXTO</text>
  <!-- pagina de perifericos -->
  <rect x="70" y="280" width="150" height="14" fill="#fed7aa" stroke="#d97706"/>
  <!-- sin mapear -->
  <text x="145" y="590" text-anchor="middle" class="cap">sin mapear</text>
  <text x="145" y="608" text-anchor="middle" class="cap">IN → 0 · OUT → nada</text>
  <!-- etiquetas de direccion -->
  <text x="62" y="114" text-anchor="end" class="adr">0x0000</text>
  <text x="62" y="245" text-anchor="end" class="adr">0x0400</text>
  <text x="62" y="292" text-anchor="end" class="adr">0x0500</text>
  <text x="62" y="927" text-anchor="end" class="adr">0xFFFF</text>
  <text x="228" y="200" class="cap">PANTALLA</text>
  <text x="228" y="214" class="cap">(gráficos + texto</text>
  <text x="228" y="228" class="cap">van juntos)</text>

  <!-- lineas de "explosion" hacia el detalle -->
  <path d="M220,110 L360,150" fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M220,294 L360,900" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ================= detalle ================= -->
  <text x="372" y="96" class="grp">Detalle</text>
  <g class="hd">
    <text x="372" y="132">PUERTO</text>
    <text x="520" y="132">NOMBRE</text>
    <text x="700" y="132">AC.</text>
    <text x="752" y="132">QUÉ HACE · CÓMO SE USA CON IN / OUT</text>
  </g>
  <line x1="372" y1="140" x2="1240" y2="140" stroke="#cbd5e1"/>

  <!-- PANTALLA: GRAFICOS -->
  <rect x="360" y="150" width="6" height="34" fill="#0969da"/>
  <text x="372" y="163" class="grp" fill="#0969da">PANTALLA · GRÁFICOS (framebuffer)  ·  lectura y escritura</text>
  <text x="372" y="180" class="adr">0x0000–0x03FF</text>
  <text x="520" y="180" class="nm">g_fb</text>
  <rect x="696" y="170" width="24" height="13" rx="2" fill="#0969da"/><text x="700" y="180" class="ac">IO</text>
  <text x="752" y="180" class="fn">128×64 mono · 1 puerto = 8 px horizontales (bit 7 = izquierda) · puerto = y·16 + xbyte</text>

  <!-- PANTALLA: TEXTO -->
  <rect x="360" y="196" width="6" height="56" fill="#0969da"/>
  <text x="372" y="209" class="grp" fill="#0969da">PANTALLA · TEXTO (rejilla monospace, encima del gráfico)  ·  lectura y escritura</text>
  <text x="372" y="228" class="adr">0x0400–0x04FF</text>
  <text x="520" y="228" class="nm">g_text</text>
  <rect x="696" y="218" width="24" height="13" rx="2" fill="#0969da"/><text x="700" y="228" class="ac">IO</text>
  <text x="752" y="228" class="fn">celda 6×8 (fuente 5×7) · puerto = 0x0400 + fila·32 + col   (fila 0–7, col 0–20)</text>
  <text x="752" y="246" class="fn">byte = código ASCII: 0 → transparente · 0x20 → celda en blanco · resto → glifo opaco</text>

  <!-- ENTRADA -->
  <rect x="360" y="264" width="6" height="130" fill="#0969da"/>
  <text x="372" y="277" class="grp" fill="#0969da">ENTRADA  ·  encoders e interruptores  (solo IN)</text>
  <g>
    <text x="372" y="298" class="adr">0x0500</text><text x="520" y="298" class="nm">PORT_DIR_POS</text>
    <rect x="696" y="288" width="24" height="13" rx="2" fill="#0969da"/><text x="701" y="298" class="ac">IN</text>
    <text x="752" y="298" class="fn">encoder ADDR: posición 0–255 (contador que envuelve; resta la lectura anterior)</text>

    <text x="372" y="320" class="adr">0x0501</text><text x="520" y="320" class="nm">PORT_DIR_BTN</text>
    <rect x="696" y="310" width="24" height="13" rx="2" fill="#0969da"/><text x="701" y="320" class="ac">IN</text>
    <text x="752" y="320" class="fn">encoder ADDR: bit 0 = pulsado</text>

    <text x="372" y="342" class="adr">0x0502</text><text x="520" y="342" class="nm">PORT_DAT_POS</text>
    <rect x="696" y="332" width="24" height="13" rx="2" fill="#0969da"/><text x="701" y="342" class="ac">IN</text>
    <text x="752" y="342" class="fn">encoder DATA: posición 0–255</text>

    <text x="372" y="364" class="adr">0x0503</text><text x="520" y="364" class="nm">PORT_DAT_BTN</text>
    <rect x="696" y="354" width="24" height="13" rx="2" fill="#0969da"/><text x="701" y="364" class="ac">IN</text>
    <text x="752" y="364" class="fn">encoder DATA: bit 0 = pulsado</text>
  </g>

  <!-- SALIDA LED -->
  <rect x="360" y="384" width="6" height="42" fill="#d97706"/>
  <text x="372" y="397" class="grp" fill="#b45309">SALIDA  ·  LED de a bordo</text>
  <text x="372" y="418" class="adr">0x0510</text><text x="520" y="418" class="nm">PORT_LED</text>
  <rect x="696" y="408" width="24" height="13" rx="2" fill="#d97706"/><text x="700" y="418" class="ac">IO</text>
  <text x="752" y="418" class="fn">OUT bit 0 → enciende el LED azul del SuperMini (GPIO8) · IN devuelve el eco</text>

  <!-- TEMPORIZADORES -->
  <rect x="360" y="436" width="6" height="60" fill="#0d9488"/>
  <text x="372" y="449" class="grp" fill="#0f766e">TEMPORIZADORES  ·  8 cuentas atrás</text>
  <text x="372" y="470" class="adr">0x0520–0x0527</text><text x="520" y="470" class="nm">PORT_TIMER_BASE + i</text>
  <rect x="696" y="460" width="24" height="13" rx="2" fill="#0d9488"/><text x="700" y="470" class="ac">IO</text>
  <text x="752" y="470" class="fn">OUT arma (0–255); decrece solo hasta 0 y se queda · IN lee el valor actual</text>
  <text x="752" y="488" class="fn">tᵢ baja 1 cada (1 &lt;&lt; i) ms  →  t0..t7 = 1, 2, 4, 8, 16, 32, 64, 128 ms/paso</text>

  <!-- SONIDO -->
  <rect x="360" y="506" width="6" height="108" fill="#db2777"/>
  <text x="372" y="519" class="grp" fill="#be185d">SONIDO  ·  zumbador piezo PASIVO en GPIO3</text>
  <g>
    <text x="372" y="540" class="adr">0x0530</text><text x="520" y="540" class="nm">PORT_SND_FREQ_LO</text>
    <rect x="696" y="530" width="24" height="13" rx="2" fill="#db2777"/><text x="700" y="540" class="ac">IO</text>
    <text x="752" y="540" class="fn">frecuencia en Hz, byte bajo — solo se engancha (aún no suena)</text>

    <text x="372" y="562" class="adr">0x0531</text><text x="520" y="562" class="nm">PORT_SND_FREQ_HI</text>
    <rect x="696" y="552" width="24" height="13" rx="2" fill="#db2777"/><text x="700" y="562" class="ac">IO</text>
    <text x="752" y="562" class="fn">byte alto; al escribirlo SUENA  Hz = alto·256 + bajo  (Hz = 0 → silencio)</text>

    <text x="372" y="584" class="adr">0x0532</text><text x="520" y="584" class="nm">PORT_SND_NOTE</text>
    <rect x="696" y="574" width="24" height="13" rx="2" fill="#db2777"/><text x="700" y="584" class="ac">IO</text>
    <text x="752" y="584" class="fn">nota MIDI 0–127 (0 = silencio) · 69 = LA4 = 440 Hz · +12 = una octava · la forma fácil</text>

    <text x="372" y="606" class="adr">0x0533</text><text x="520" y="606" class="nm">PORT_SND_DUR</text>
    <rect x="696" y="596" width="24" height="13" rx="2" fill="#db2777"/><text x="700" y="606" class="ac">IO</text>
    <text x="752" y="606" class="fn">duración automática = valor · 10 ms, luego se calla sola (0 = sostenida; "pegajosa")</text>
  </g>

  <!-- resto -->
  <rect x="360" y="624" width="6" height="20" fill="#cbd5e1"/>
  <text x="372" y="638" class="adr">resto</text>
  <text x="752" y="638" class="fn">IN → 0 · OUT → no hace nada</text>

  <line x1="372" y1="658" x2="1240" y2="658" stroke="#cbd5e1"/>

  <!-- notas -->
  <text x="372" y="682" class="grp">Notas</text>
  <text x="372" y="702" class="note">•  Gráficos, texto, encoders, LED, temporizadores y sonido se ponen a 0 al (re)arrancar una ejecución.</text>
  <text x="372" y="720" class="note">•  Temporizadores y sonido solo avanzan en modo CONTINUO; en PASO A PASO están congelados. El sonido también calla al HALT.</text>
  <text x="372" y="738" class="note">•  IN no modifica los flags: para esperar a que un contador/temporizador llegue a 0, haz  CMP reg,#0  antes del salto condicional.</text>
  <text x="372" y="756" class="note">•  Codificación:  IN reg,(port16) = 0x68+r , lo , hi   ·   OUT (port16),reg = 0x70+r , lo , hi   (puerto de 16 bits, little-endian).</text>

  <!-- ejemplos -->
  <rect x="372" y="776" width="410" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="386" y="796" class="grp">Escribir "HI" arriba a la izquierda</text>
  <text x="386" y="818" class="mono">MOV AL,#0x48     ; 'H'</text>
  <text x="386" y="836" class="mono">OUT (0x0400),AL  ; celda (col 0, fila 0)</text>
  <text x="386" y="854" class="mono">MOV AL,#0x49     ; 'I'</text>
  <text x="386" y="872" class="mono">OUT (0x0401),AL  ; celda (col 1, fila 0)</text>
  <text x="386" y="890" class="mono">HALT</text>
  <text x="386" y="914" class="cap">sin salto de línea automático: incrementa el puerto</text>

  <rect x="806" y="776" width="424" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="796" class="grp">Pitido LA4 de 100 ms</text>
  <text x="820" y="818" class="mono">MOV AL,#10       ; 10 × 10 ms</text>
  <text x="820" y="836" class="mono">OUT (0x0533),AL  ; PORT_SND_DUR</text>
  <text x="820" y="854" class="mono">MOV AL,#69       ; nota 69 = LA4</text>
  <text x="820" y="872" class="mono">OUT (0x0532),AL  ; PORT_SND_NOTE</text>
  <text x="820" y="890" class="mono">HALT</text>
  <text x="820" y="914" class="cap">se calla sola a los 100 ms</text>

  <text x="40" y="962" class="cap">compi_panel · docs/ports.svg — mantener sincronizado con specs.txt §8 e include/iomap.h</text>
</svg>
