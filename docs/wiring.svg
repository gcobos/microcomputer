<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1520 1180" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="1520" height="1180" fill="#ffffff"/>
  <defs>
    <g id="gnd" stroke-width="1.6" stroke="#222" fill="none">
      <line x1="0" y1="0" x2="0" y2="7"/><line x1="-8" y1="7" x2="8" y2="7"/>
      <line x1="-5" y1="11" x2="5" y2="11"/><line x1="-2" y1="15" x2="2" y2="15"/>
    </g>
    <!-- resistencia: rectangulo (IEC). #res vertical (0,0)->(0,34); #resr horizontal (0,0)->(32,0) -->
    <g id="res"><rect x="-6" y="0" width="12" height="34" fill="#ffffff" stroke="#cc2222" stroke-width="1.8"/></g>
    <g id="resr"><rect x="0" y="-6" width="32" height="12" fill="#ffffff" stroke="#cc2222" stroke-width="1.8"/></g>
  </defs>
  <style>
    .wire{fill:none;stroke-width:2}
    .p3{stroke:#cc2222} .gnd{stroke:#222} .spi{stroke:#1a7f37}
    .i2c{stroke:#8250df} .ctl{stroke:#d97706} .in{stroke:#0969da}
    .snd{stroke:#0891b2} .v5{stroke:#be185d}
    .chip{fill:#eef2ff;stroke:#334155;stroke-width:1.5}
    .chip2{fill:#f0fdf4;stroke:#334155;stroke-width:1.5}
    .dev{fill:#fff7ed;stroke:#334155;stroke-width:1.5}
    .pin{font-size:10.5px;font-family:ui-monospace,Consolas,monospace;fill:#1e293b}
    .sig{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#475569}
    .lbl{font-size:12px;fill:#1e293b}
    .ttl{font-size:13.5px;font-weight:700;fill:#0f172a}
    .dot{fill:#222} .p3t{fill:#cc2222;font-size:10px;font-weight:600}
    .v5t{fill:#be185d;font-size:10px;font-weight:600}
  </style>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#0f172a">compi_panel — cableado del panel frontal (ESP32-C3 SuperMini)</text>
  <text x="40" y="54" class="lbl" fill="#475569">Detalle de pines y lista de materiales: docs/hardware.md · Especificación: specs.txt</text>

  <line class="wire p3"  x1="30" y1="80" x2="1490" y2="80"/>
  <text x="30" y="73" class="lbl" fill="#cc2222" font-weight="700">+3V3</text>
  <line class="wire gnd" x1="30" y1="1140" x2="1490" y2="1140"/>
  <text x="30" y="1133" class="lbl" font-weight="700">GND</text>
  <text x="1490" y="73" class="sig" text-anchor="end">Muñón rojo "3V3" = red +3V3 común (sin cable hasta el riel) · "GND" todas comunes</text>

  <!-- ESP32-C3 SuperMini -->
  <rect class="chip" x="70" y="150" width="185" height="480" rx="6"/>
  <text x="162" y="140" class="ttl" text-anchor="middle">ESP32-C3 SuperMini</text>
  <line class="wire p3"  x1="200" y1="150" x2="200" y2="126"/><text x="200" y="120" class="p3t" text-anchor="middle">3V3</text>
  <line class="wire v5"  x1="250" y1="150" x2="250" y2="126"/><text x="250" y="120" class="v5t" text-anchor="middle">5V</text>
  <text x="262" y="120" class="sig" fill="#be185d">batería, opcional — ver abajo</text>
  <line class="wire gnd" x1="120" y1="630" x2="120" y2="1140"/><text x="127" y="662" class="sig">GND</text>

  <line class="wire spi" x1="255" y1="200" x2="287" y2="200"/><text class="pin" x="249" y="203" text-anchor="end">IO4</text><text class="sig" x="264" y="194">SCK</text>
  <line class="wire spi" x1="255" y1="235" x2="287" y2="235"/><text class="pin" x="249" y="238" text-anchor="end">IO5</text><text class="sig" x="264" y="229">MISO</text>
  <line class="wire spi" x1="255" y1="270" x2="287" y2="270"/><text class="pin" x="249" y="273" text-anchor="end">IO6</text><text class="sig" x="264" y="264">MOSI</text>
  <line class="wire spi" x1="255" y1="305" x2="287" y2="305"/><text class="pin" x="249" y="308" text-anchor="end">IO7</text><text class="sig" x="264" y="299">FLASH /CS</text>
  <line class="wire i2c" x1="255" y1="365" x2="287" y2="365"/><text class="pin" x="249" y="368" text-anchor="end">IO20</text><text class="sig" x="264" y="359">SDA</text>
  <line class="wire i2c" x1="255" y1="400" x2="287" y2="400"/><text class="pin" x="249" y="403" text-anchor="end">IO21</text><text class="sig" x="264" y="394">SCL</text>
  <line class="wire ctl" x1="255" y1="460" x2="287" y2="460"/><text class="pin" x="249" y="463" text-anchor="end">IO0</text><text class="sig" x="264" y="451">165 CP</text>
  <line class="wire ctl" x1="255" y1="500" x2="287" y2="500"/><text class="pin" x="249" y="503" text-anchor="end">IO1</text><text class="sig" x="264" y="491">165 Q7</text>
  <line class="wire ctl" x1="255" y1="540" x2="287" y2="540"/><text class="pin" x="249" y="543" text-anchor="end">IO10</text><text class="sig" x="264" y="531">165 PL</text>
  <line class="wire snd" x1="255" y1="575" x2="287" y2="575"/><text class="pin" x="249" y="578" text-anchor="end">IO3</text><text class="sig" x="264" y="566">tono (PWM/LEDC) &#8594; piezo</text>
  <text class="pin" x="249" y="612" text-anchor="end">IO8</text><text class="sig" x="264" y="612">LED azul de a bordo (activo bajo) &#8212; no hace falta LED externo</text>

  <!-- Flash -->
  <rect class="chip2" x="520" y="150" width="235" height="185" rx="6"/>
  <text x="637" y="140" class="ttl" text-anchor="middle">Flash W25Q32 · SPI</text>
  <line class="wire spi" x1="498" y1="185" x2="520" y2="185"/><text class="pin" x="528" y="188">/CS</text>
  <line class="wire spi" x1="498" y1="220" x2="520" y2="220"/><text class="pin" x="528" y="223">DO &#8594; MISO</text>
  <line class="wire spi" x1="498" y1="255" x2="520" y2="255"/><text class="pin" x="528" y="258">DI &#8592; MOSI</text>
  <line class="wire spi" x1="498" y1="290" x2="520" y2="290"/><text class="pin" x="528" y="293">CLK</text>
  <text class="pin" x="747" y="188" text-anchor="end">/WP</text><line class="wire p3" x1="755" y1="185" x2="775" y2="185"/><text class="p3t" x="779" y="188">3V3</text>
  <text class="pin" x="747" y="223" text-anchor="end">/HOLD</text><line class="wire p3" x1="755" y1="220" x2="775" y2="220"/><text class="p3t" x="779" y="223">3V3</text>
  <text class="pin" x="747" y="293" text-anchor="end">VCC</text><line class="wire p3" x1="755" y1="290" x2="775" y2="290"/><text class="p3t" x="779" y="293">3V3</text>
  <line class="wire gnd" x1="637" y1="335" x2="637" y2="1140"/><text class="sig" x="643" y="360">GND</text>
  <circle class="dot" cx="470" cy="185" r="3"/>
  <use xlink:href="#resr" transform="translate(470,185) rotate(-90)"/>
  <line class="wire p3" x1="470" y1="153" x2="470" y2="132"/><text class="p3t" x="470" y="126" text-anchor="middle">3V3</text><text class="p3t" x="482" y="150">10k</text>
  <path class="wire spi" d="M287,200 H305 V290 H498"/>
  <path class="wire spi" d="M287,235 H340 V220 H498"/>
  <path class="wire spi" d="M287,270 H320 V255 H498"/>
  <path class="wire spi" d="M287,305 H360 V185 H470 H498"/>

  <!-- OLED -->
  <rect class="chip2" x="850" y="150" width="240" height="150" rx="6"/>
  <text x="970" y="140" class="ttl" text-anchor="middle">OLED SH1106 · I2C (0x3C)</text>
  <line class="wire i2c" x1="828" y1="190" x2="850" y2="190"/><text class="pin" x="836" y="193">SDA</text>
  <line class="wire i2c" x1="828" y1="225" x2="850" y2="225"/><text class="pin" x="836" y="228">SCL</text>
  <text class="pin" x="836" y="262">VCC</text><line class="wire p3" x1="828" y1="259" x2="850" y2="259"/><text class="p3t" x="802" y="262">3V3</text>
  <text class="pin" x="836" y="295">GND</text><line class="wire gnd" x1="812" y1="292" x2="850" y2="292"/><line class="wire gnd" x1="812" y1="292" x2="812" y2="1140"/>
  <path class="wire i2c" d="M287,365 H828 V190 H838"/>
  <path class="wire i2c" d="M287,400 H814 V225 H838"/>

  <!-- zumbador piezo pasivo (salida de sonido) -->
  <rect class="dev" x="150" y="694" width="185" height="54" rx="5"/>
  <text x="242" y="688" class="ttl" text-anchor="middle" font-size="12">Zumbador piezo PASIVO</text>
  <text class="pin" x="287" y="713" text-anchor="middle">+</text>
  <text class="pin" x="164" y="740">&#8722;</text>
  <!-- + : de IO3, por 100 ohm (opcional), baja al terminal + -->
  <path class="wire snd" d="M287,575 V622 M287,656 V694"/>
  <use xlink:href="#res" transform="translate(287,622)"/>
  <text x="299" y="645" font-size="9.5" font-weight="600" fill="#0891b2">100 &#8486; opc.</text>
  <!-- - : del terminal -, por la izquierda, al bajante de GND del ESP32 -->
  <path class="wire gnd" d="M150,736 H120"/>
  <circle class="dot" cx="120" cy="736" r="3"/>
  <text class="sig" x="150" y="776">tono cuadrado por hardware &#8212; tone() / LEDC</text>
  <text class="sig" x="150" y="790">solo suena en CONTINUO &#183; puertos 0x0530&#8211;0x0533</text>
  <text class="sig" x="150" y="804">PASIVO: un buzzer activo solo dar&#237;a un pitido fijo</text>

  <!-- 74HC165 -->
  <rect class="chip" x="475" y="415" width="220" height="310" rx="6"/>
  <text x="585" y="405" class="ttl" text-anchor="middle">74HC165</text>
  <text class="pin" x="485" y="448">VCC (16)</text><line class="wire p3" x1="453" y1="445" x2="475" y2="445"/><text class="p3t" x="427" y="442">3V3</text>
  <line class="wire ctl" x1="453" y1="485" x2="475" y2="485"/><text class="pin" x="485" y="488">PL (1)</text>
  <line class="wire ctl" x1="453" y1="525" x2="475" y2="525"/><text class="pin" x="485" y="528">CP (2)</text>
  <line class="wire ctl" x1="453" y1="565" x2="475" y2="565"/><text class="pin" x="485" y="568">Q7 (9)</text>
  <text class="pin" x="485" y="608">GND (8)</text><line class="wire gnd" x1="453" y1="605" x2="475" y2="605"/>
  <text class="pin" x="485" y="648">CLKINH (15)</text><line class="wire gnd" x1="453" y1="645" x2="475" y2="645"/>
  <text class="pin" x="485" y="688">SER (10)</text><line class="wire gnd" x1="453" y1="685" x2="475" y2="685"/>
  <line class="wire gnd" x1="453" y1="605" x2="410" y2="605"/>
  <line class="wire gnd" x1="453" y1="645" x2="410" y2="645"/>
  <line class="wire gnd" x1="453" y1="685" x2="410" y2="685"/>
  <line class="wire gnd" x1="410" y1="605" x2="410" y2="1140"/>

  <path class="wire ctl" d="M287,460 H330 V525 H453"/>
  <path class="wire ctl" d="M287,500 H312 V565 H453"/>
  <path class="wire ctl" d="M287,540 H348 V485 H453"/>

  <!-- D0..D7 inputs -->
  <g class="pin" text-anchor="end">
    <text x="687" y="445">D0 (11)</text><text x="687" y="483">D1 (12)</text><text x="687" y="521">D2 (13)</text>
    <text x="687" y="559">D3 (14)</text><text x="687" y="597">D4 (3)</text><text x="687" y="635">D5 (4)</text>
    <text x="687" y="673">D6 (5)</text><text x="687" y="711">D7 (6)</text>
  </g>
  <line class="wire in" x1="695" y1="442" x2="835" y2="442"/>
  <line class="wire in" x1="695" y1="480" x2="835" y2="480"/>
  <line class="wire in" x1="695" y1="518" x2="835" y2="518"/>
  <line class="wire in" x1="695" y1="556" x2="835" y2="556"/>
  <line class="wire in" x1="695" y1="594" x2="835" y2="594"/>
  <line class="wire in" x1="695" y1="632" x2="835" y2="632"/>
  <line class="wire in" x1="695" y1="670" x2="832" y2="670"/>
  <line class="wire in" x1="695" y1="708" x2="832" y2="708"/>

  <!-- pull-ups: 8 x 10k a 3V3 (bus local, sin cable hasta el riel superior) -->
  <line class="wire p3" x1="716" y1="408" x2="845" y2="408"/>
  <line class="wire p3" x1="842" y1="408" x2="842" y2="384"/><text class="p3t" x="842" y="378" text-anchor="middle">3V3</text>
  <g>
    <use xlink:href="#res" transform="translate(722,410)"/><line class="wire p3" x1="722" y1="444" x2="722" y2="442"/><circle class="dot" cx="722" cy="442" r="2.5"/>
    <use xlink:href="#res" transform="translate(734,410)"/><line class="wire p3" x1="734" y1="444" x2="734" y2="480"/><circle class="dot" cx="734" cy="480" r="2.5"/>
    <use xlink:href="#res" transform="translate(746,410)"/><line class="wire p3" x1="746" y1="444" x2="746" y2="518"/><circle class="dot" cx="746" cy="518" r="2.5"/>
    <use xlink:href="#res" transform="translate(758,410)"/><line class="wire p3" x1="758" y1="444" x2="758" y2="556"/><circle class="dot" cx="758" cy="556" r="2.5"/>
    <use xlink:href="#res" transform="translate(770,410)"/><line class="wire p3" x1="770" y1="444" x2="770" y2="594"/><circle class="dot" cx="770" cy="594" r="2.5"/>
    <use xlink:href="#res" transform="translate(782,410)"/><line class="wire p3" x1="782" y1="444" x2="782" y2="632"/><circle class="dot" cx="782" cy="632" r="2.5"/>
    <use xlink:href="#res" transform="translate(794,410)"/><line class="wire p3" x1="794" y1="444" x2="794" y2="670"/><circle class="dot" cx="794" cy="670" r="2.5"/>
    <use xlink:href="#res" transform="translate(806,410)"/><line class="wire p3" x1="806" y1="444" x2="806" y2="708"/><circle class="dot" cx="806" cy="708" r="2.5"/>
  </g>
  <text class="p3t" x="700" y="400" text-anchor="end">10k &#215;8</text>

  <!-- encoders -->
  <rect class="dev" x="835" y="428" width="120" height="94" rx="5"/>
  <text x="895" y="422" class="ttl" text-anchor="middle" font-size="12">ADDR encoder</text>
  <text class="pin" x="843" y="445">A</text><text class="pin" x="843" y="483">B</text><text class="pin" x="843" y="521">SW</text>
  <line class="wire gnd" x1="955" y1="480" x2="998" y2="480"/><text class="pin" x="960" y="476">C</text>

  <rect class="dev" x="835" y="540" width="120" height="94" rx="5"/>
  <text x="895" y="534" class="ttl" text-anchor="middle" font-size="12">DATA encoder</text>
  <text class="pin" x="843" y="559">A</text><text class="pin" x="843" y="597">B</text><text class="pin" x="843" y="635">SW</text>
  <line class="wire gnd" x1="955" y1="594" x2="998" y2="594"/><text class="pin" x="960" y="590">C</text>
  <line class="wire gnd" x1="998" y1="480" x2="998" y2="1140"/>
  <text class="sig" x="1004" y="460">común (C) &#8594; GND</text>

  <!-- switches -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <g transform="translate(832,670)"><circle cx="0" cy="0" r="3"/><circle cx="44" cy="0" r="3"/><line x1="3" y1="0" x2="14" y2="0"/><line x1="33" y1="0" x2="41" y2="0"/><line x1="14" y1="-2" x2="35" y2="-13"/></g>
    <g transform="translate(832,708)"><circle cx="0" cy="0" r="3"/><circle cx="44" cy="0" r="3"/><line x1="3" y1="0" x2="14" y2="0"/><line x1="33" y1="0" x2="41" y2="0"/><line x1="14" y1="-2" x2="35" y2="-13"/></g>
  </g>
  <line class="wire gnd" x1="876" y1="670" x2="906" y2="670"/><line class="wire gnd" x1="876" y1="708" x2="906" y2="708"/>
  <line class="wire gnd" x1="906" y1="670" x2="906" y2="1140"/>
  <text class="pin" x="914" y="666">SW_MODE  (EDIT / RUN)</text>
  <text class="pin" x="914" y="704">SW_STEP  (según SW_MODE)</text>
  <text class="sig" x="914" y="732">abierto = 1ª opción · cerrado (a GND) = 2ª</text>

  <!-- ================= ALIMENTACIÓN POR BATERÍA (opcional) ================= -->
  <text x="40" y="955" class="ttl">ALIMENTACIÓN POR BATERÍA (opcional)</text>
  <text x="40" y="972" class="sig">El interruptor corta solo la batería; el USB-C de la SuperMini (para programar / provisioning) sigue</text>
  <text x="40" y="985" class="sig">funcionando igual, con o sin batería puesta — entra por su propio regulador, no por el pin 5V de abajo.</text>

  <!-- batería -->
  <rect class="dev" x="40" y="1019" width="150" height="85" rx="5"/>
  <text x="115" y="1013" class="ttl" text-anchor="middle" font-size="12">LiPo 1S 3,7 V</text>
  <text class="sig" x="50" y="1046">capacidad según</text>
  <text class="sig" x="50" y="1059">la carcasa</text>
  <text class="sig" x="50" y="1078">conector JST-PH 2,0</text>
  <text class="pin" x="182" y="1038" text-anchor="end">+</text>
  <text class="pin" x="182" y="1093" text-anchor="end">&#8722;</text>
  <line class="wire v5"  x1="190" y1="1034" x2="225" y2="1034"/>
  <line class="wire gnd" x1="190" y1="1089" x2="225" y2="1089"/>

  <!-- cargador TP4056 con protección -->
  <rect class="chip2" x="225" y="1019" width="240" height="85" rx="6"/>
  <text x="345" y="1013" class="ttl" text-anchor="middle" font-size="12">Cargador LiPo TP4056 (protegido)</text>
  <text class="pin" x="233" y="1038">B+</text>
  <text class="pin" x="233" y="1093">B&#8722;</text>
  <text class="sig" x="256" y="1054">DW01A + FS8205A</text>
  <text class="sig" x="256" y="1067">USB-C/microUSB: carga</text>
  <text class="sig" x="256" y="1080">(aparte del USB de la SuperMini)</text>
  <text class="pin" x="457" y="1038" text-anchor="end">OUT+</text>
  <text class="pin" x="457" y="1093" text-anchor="end">OUT&#8722;</text>
  <line class="wire v5"  x1="465" y1="1034" x2="490" y2="1034"/>
  <line class="wire gnd" x1="465" y1="1089" x2="465" y2="1140"/>

  <!-- interruptor de alimentación general -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <g transform="translate(490,1034)"><circle cx="0" cy="0" r="3"/><circle cx="44" cy="0" r="3"/><line x1="3" y1="0" x2="14" y2="0"/><line x1="33" y1="0" x2="41" y2="0"/><line x1="14" y1="-2" x2="35" y2="-13"/></g>
  </g>
  <text class="pin" x="497" y="1018">interruptor ON/OFF</text>
  <text class="sig" x="497" y="1062">(solo corta la batería;</text>
  <text class="sig" x="497" y="1075">el USB no pasa por aquí)</text>
  <line class="wire v5" x1="534" y1="1034" x2="570" y2="1034"/>
  <text class="v5t" x="576" y="1038">5V</text>
  <text class="sig" x="600" y="1038" fill="#be185d">&#8594; SuperMini (mismo nombre arriba)</text>

  <!-- legend -->
  <rect x="1160" y="150" width="330" height="273" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1178" y="174" class="ttl">Leyenda</text>
  <g class="lbl">
    <line class="wire p3"  x1="1178" y1="193" x2="1210" y2="193"/><text x="1220" y="197">+3V3 (todas comunes)</text>
    <line class="wire gnd" x1="1178" y1="214" x2="1210" y2="214"/><text x="1220" y="218">GND (todas comunes)</text>
    <line class="wire snd" x1="1178" y1="235" x2="1210" y2="235"/><text x="1220" y="239">Sonido — piezo pasivo (IO3)</text>
    <line class="wire spi" x1="1178" y1="256" x2="1210" y2="256"/><text x="1220" y="260">SPI &#8212; SCK / MISO / MOSI / CS</text>
    <line class="wire i2c" x1="1178" y1="277" x2="1210" y2="277"/><text x="1220" y="281">I2C &#8212; SDA / SCL</text>
    <line class="wire ctl" x1="1178" y1="298" x2="1210" y2="298"/><text x="1220" y="302">74HC165 &#8212; PL / CP / Q7</text>
    <line class="wire in"  x1="1178" y1="319" x2="1210" y2="319"/><text x="1220" y="323">Entradas del panel (D0–D7)</text>
    <line class="wire v5"  x1="1178" y1="340" x2="1210" y2="340"/><text x="1220" y="344">5V — batería, opcional (§ abajo)</text>
